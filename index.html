<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MayLeenVT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #101810;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 18px;
      background: #101810;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    #offline {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      background-image: url("offline.png");
      background-size: cover;
      background-position: center;
    }

    #offline::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.08);
      transition: 0.2s ease;
    }

    #offline:hover::after {
      background: rgba(0, 0, 0, 0.2);
    }

    #offlineText {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      padding: 10px 18px;

      border-radius: 999px;

      background: rgba(15, 25, 17, 0.85);
      color: white;

      font-size: 14px;
      font-weight: 600;

      z-index: 2;

      backdrop-filter: blur(6px);
    }

    #player {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="container">

    <!-- ÉCRAN OFFLINE -->
    <a
      id="offline"
      href="https://www.twitch.tv/MayLeenVT"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div id="offlineText">
        🌙 MayLeenVT est actuellement hors ligne
      </div>
    </a>

    <!-- LECTEUR TWITCH -->
    <iframe
      id="player"
      class="hidden"
      allowfullscreen
      scrolling="no"
      frameborder="0"
    ></iframe>

  </div>


<script>

  const CHANNEL = "MayLeenVT";

  const offline = document.getElementById("offline");
  const player = document.getElementById("player");

  let lastStatus = null;


  async function checkLiveStatus() {

    try {

      const response = await fetch(
        `https://www.henrikhjelm.se/api/twitch.php?user=${CHANNEL}`
      );

      if (!response.ok) {
        throw new Error("Erreur API");
      }

      const data = await response.json();

      const isLive = data.live === "yes";


      if (isLive === lastStatus) {
        return;
      }

      lastStatus = isLive;


      if (isLive) {

        // Affichage du lecteur Twitch

        offline.classList.add("hidden");
        player.classList.remove("hidden");

        const parent = window.location.hostname;

        player.src =
          `https://player.twitch.tv/?channel=${CHANNEL}` +
          `&parent=${encodeURIComponent(parent)}` +
          `&muted=true`;

      } else {

        // Affichage de l'image offline

        player.classList.add("hidden");
        offline.classList.remove("hidden");

        player.src = "";

      }

    } catch (error) {

      console.error(
        "Impossible de vérifier le statut Twitch :",
        error
      );

    }

  }


  // Première vérification
  checkLiveStatus();


  // Vérification toutes les 30 secondes
  setInterval(
    checkLiveStatus,
    30000
  );

</script>

</body>
</html>
